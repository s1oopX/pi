name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  # The root tsconfig only globs packages/*/src, so the desktop renderer
  # (packages/desktop/renderer-next/src) is outside `tsgo --noEmit`. Type-check
  # it through its own tsconfig, and build it so a broken renderer fails CI
  # rather than only surfacing at packaging time.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check renderer
        run: npx tsc --noEmit
        working-directory: packages/desktop/renderer-next

      - name: Lint renderer
        run: npm run lint:desktop-renderer

      - name: Build renderer
        run: npx vite build
        working-directory: packages/desktop/renderer-next
