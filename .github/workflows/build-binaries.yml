name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    # Release automation targets the upstream repo; skip it on forks so a
    # stray v* tag here cannot attempt an npm publish.
    if: github.repository == 'earendil-works/pi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/pi-${VERSION}-source.tar.gz"

      - name: Build binaries from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/pi-${VERSION}-source.tar.gz" -C "${build_root}"
          "${build_root}/pi-${VERSION}/scripts/build-binaries.sh" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare GitHub release payload
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md
          node scripts/generate-coding-agent-install-lock.mjs --check
          cp packages/coding-agent/install-lock/package.json release-assets/pi-coding-agent-install-package.json
          cp packages/coding-agent/install-lock/package-lock.json release-assets/pi-coding-agent-install-package-lock.json

          cd packages/coding-agent/binaries

          binary_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
          )

          for asset in "${binary_assets[@]}"; do
            test -f "${asset}"
          done

          cp "${binary_assets[@]}" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="pi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    if: github.repository == 's1oopX/pi-studio-dev'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Check repository
        run: npm run check

      - name: Check desktop main process
        run: npm run check:main -w @s1oopx/pi-studio-dev

      - name: Build desktop package
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $desktopVersion = node -p "require('./packages/desktop/package.json').version"
          $rendererVersion = node -p "require('./packages/desktop/renderer-next/package.json').version"
          $codingAgentVersion = node -p "require('./packages/coding-agent/package.json').version"
          if ($tagVersion -ne $desktopVersion -or $tagVersion -ne $rendererVersion -or $tagVersion -ne $codingAgentVersion) {
            throw "Release tag $($env:RELEASE_TAG) does not match desktop version $desktopVersion, renderer version $rendererVersion, or coding-agent version $codingAgentVersion"
          }
          npm --prefix packages/desktop run build:renderer
          npm --prefix packages/desktop run build:backend
          npm --prefix packages/desktop test
          Push-Location packages/desktop
          # Upstream forces code signing via a certificate in WIN_CSC_LINK. A
          # fork that lacks that secret must build unsigned (the SmartScreen
          # "still run" path), so only pass forceCodeSigning when a cert exists.
          if ($env:WIN_CSC_LINK) {
            npx --no-install electron-builder --win portable --x64 --config.electronDist=../../node_modules/electron/dist --config.forceCodeSigning=true
          } else {
            npx --no-install electron-builder --win portable --x64 --config.electronDist=../../node_modules/electron/dist
          }
          Pop-Location

          # The artifact name follows packages/desktop/package.json build.artifactName
          # (PiStudio-Dev-<version>.exe on this fork). Resolve the real file rather
          # than hardcoding a name, and only verify the signature when we signed.
          $artifact = Get-ChildItem "packages/desktop/release/PiStudio*$desktopVersion.exe" | Select-Object -First 1
          if (-not $artifact) { throw "Desktop artifact not found for $desktopVersion" }
          if ($env:WIN_CSC_LINK) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Desktop artifact signature is $($signature.Status): $($signature.StatusMessage)"
            }
          }

      - name: Run packaged desktop E2E
        run: npm run test:e2e -w @s1oopx/pi-studio-dev
        env:
          PI_STUDIO_E2E_EXECUTABLE: ${{ github.workspace }}/packages/desktop/release/win-unpacked/Pi Studio Dev.exe
          PI_STUDIO_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts

      - name: Upload desktop E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-failure-${{ env.RELEASE_TAG }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare desktop release payload
        shell: pwsh
        run: |
          $version = node -p "require('./packages/desktop/package.json').version"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          # The artifact name follows packages/desktop/package.json build.artifactName;
          # resolve the real file via glob rather than hardcoding a prefix.
          $artifact = Get-ChildItem "packages/desktop/release/PiStudio*$version.exe" | Select-Object -First 1
          if (-not $artifact) { throw "Desktop artifact not found for $version" }
          Copy-Item $artifact.FullName "release-assets/$($artifact.Name)"

      - name: Upload desktop release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    # Upstream needs both the cross-platform binaries (build) and the desktop
    # exe (build-desktop). A fork only ships the Windows exe — the build job
    # fails there on upstream-only code, so don't let that block staging.
    needs:
      - build
      - build-desktop
    if: ${{ always() && needs.build-desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        if: ${{ github.repository == 'earendil-works/pi' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download desktop release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate and stage GitHub release payload
        run: |
          set -euo pipefail
          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          IS_FORK=$([ "${GITHUB_REPOSITORY}" = "earendil-works/pi" ] && echo 0 || echo 1)

          if [ "$IS_FORK" -eq 1 ]; then
            # A fork ships only the Windows desktop exe (no cross-platform
            # binaries, no npm package, no source archive).
            desktop_asset=$(ls PiStudio-Dev-"${VERSION}".exe 2>/dev/null || ls PiStudio-"${VERSION}".exe 2>/dev/null || true)
            if [ -z "$desktop_asset" ]; then
              echo "::error::Desktop exe not found in payload"
              exit 1
            fi
            rm -f SHA256SUMS
            sha256sum "$desktop_asset" > SHA256SUMS
            sha256sum -c SHA256SUMS
            echo "Fork release assets: $desktop_asset, SHA256SUMS"
            exit 0
          fi

          source_asset="pi-${VERSION}-source.tar.gz"
          desktop_asset="PiStudio-${VERSION}.exe"
          expected_assets=(
            "${source_asset}"
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            "${desktop_asset}"
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

          checksum_assets=(
            "${source_asset}"
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            "${desktop_asset}"
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
          )
          sha256sum "${checksum_assets[@]}" > SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          IS_FORK=$([ "${GITHUB_REPOSITORY}" = "earendil-works/pi" ] && echo 0 || echo 1)

          if [ "$IS_FORK" -eq 1 ]; then
            desktop_asset=$(ls PiStudio-Dev-"${VERSION}".exe 2>/dev/null || ls PiStudio-"${VERSION}".exe 2>/dev/null || true)
            if [ -z "$desktop_asset" ]; then
              echo "::error::Desktop exe not found"
              exit 1
            fi
            release_assets=("$desktop_asset" SHA256SUMS)
          else
            source_asset="pi-${VERSION}-source.tar.gz"
            desktop_asset="PiStudio-${VERSION}.exe"
            release_assets=(
              "${source_asset}"
              pi-darwin-arm64.tar.gz
              pi-darwin-x64.tar.gz
              pi-linux-x64.tar.gz
              pi-linux-arm64.tar.gz
              pi-windows-x64.zip
              pi-windows-arm64.zip
              "${desktop_asset}"
              pi-coding-agent-install-package.json
              pi-coding-agent-install-package-lock.json
              SHA256SUMS
            )
          fi

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Fork release notes: use RELEASE_NOTES.dev.md from the repo if present,
          # else fall back to a generated one. Upstream uses the staged RELEASE_NOTES.md.
          notes_arg=(--generate-notes)
          if [ "$IS_FORK" -eq 1 ] && gh api "repos/${GITHUB_REPOSITORY}/contents/RELEASE_NOTES.dev.md?ref=${GITHUB_SHA}" --jq '.content' 2>/dev/null | base64 -d > /tmp/fork-notes.md && [ -s /tmp/fork-notes.md ]; then
            notes_arg=(--notes-file /tmp/fork-notes.md)
          elif [ -f RELEASE_NOTES.md ]; then
            notes_arg=(--notes-file RELEASE_NOTES.md)
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            "${notes_arg[@]}" \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"

          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  publish-npm:
    # Publishes upstream @earendil-works/* packages via trusted publishing,
    # which only the upstream repo is configured for. Skip on forks so a
    # v* tag here cannot attempt an npm publish that would just fail.
    if: github.repository == 'earendil-works/pi'
    runs-on: ubuntu-latest
    needs: stage-github-release
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        run: node scripts/publish.mjs

  publish-github-release:
    # Runs once staging succeeded AND either publish-npm succeeded or was
    # skipped (skipped on forks, where it's guarded to upstream). On upstream
    # this preserves the original semantics: if npm publish fails, the release
    # is not promoted. On a fork publish-npm is skipped, so the release still
    # promotes from staging alone.
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
      - publish-npm
    if: ${{ always() && needs.stage-github-release.result == 'success' && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-github-release
    # publish-npm is skipped on forks; don't treat its absence as a failure
    # here. A draft release is cleaned up only when staging or publishing
    # actually failed, not when an upstream-only job was skipped.
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
